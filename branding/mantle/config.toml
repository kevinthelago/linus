# linus default mantle configuration
# Installed to /etc/skel/.config/mantle/config.toml
# (system fallback: /etc/mantle/config.toml)

[bar]
position = "top"
height   = 36
modules_left  = ["workspaces", "launcher"]
modules_right = ["tray", "audio", "network", "battery", "clock"]

[launcher]
hotkey = "Super+Space"
icon   = "linus-logo"      # hicolor icon name

[notifications]
timeout = 5000             # ms

[theme]
tokens    = "theme/tokens.css"
overrides = "theme/overrides.css"
