# linus GRUB theme fragment
# Sourced by the live-build GRUB hook; sets display name and timeout.
# Do NOT set menuentry here — that lives in the image stream's lb config.

set menu_title="linus"
set timeout=5
set default=0

# Colour scheme (terminal/text mode fallback when GRUB gfx unavailable)
set color_normal=light-gray/black
set color_highlight=white/blue
