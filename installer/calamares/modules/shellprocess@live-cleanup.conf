---
# Runs in the LIVE session (not chrooted) immediately after the target umount.
# Cleans up any Calamares temp files from the live session environment.
# This is a best-effort step (prefixed with "-") so a failure here does not
# surface as an install error to the user.
script:
    -   "-" : "rm -f /tmp/calamares-* 2>/dev/null"
    -   "-" : "sync"

chroot: false
