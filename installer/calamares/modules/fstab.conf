---
mountOptions:
    default: "defaults,noatime"
    btrfs:   "defaults,noatime,compress=zstd:1"

# Extra options added when the target device is an SSD.
ssdExtraMountOptions:
    default: "discard=async"
    btrfs:   "discard=async,compress=zstd:1"

# /tmp is mounted as a tmpfs in the installed system.
tmpfsMountOptions: "defaults,nosuid,nodev"

# ESP mount options: restrict permissions so the EFI binary is not world-readable.
efiMountOptions: "defaults,fmask=0177,dmask=0077"
