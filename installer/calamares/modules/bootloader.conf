---
# GRUB installation for both UEFI (grub-efi-amd64) and BIOS (grub-pc).
# Calamares selects the correct path based on whether the target uses GPT+ESP or MBR.

efiBootLoader:      "grub"
grubInstall:        "grub-install"
grubMkconfig:       "grub-mkconfig"
grubCfg:            "/boot/grub/grub.cfg"
grubProbe:          "grub-probe"
efiBootMgr:         "efibootmgr"

# Install a fallback EFI binary (/EFI/BOOT/bootx64.efi) in addition to the
# vendor entry so the system boots even on firmware that ignores NVRAM entries.
installEFIFallback: true
