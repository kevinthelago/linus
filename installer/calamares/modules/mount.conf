---
# Extra filesystems bind-mounted into the target during exec modules
# so that chrooted commands (grub-install, update-initramfs, etc.) work correctly.
extraMountPoints:
    - device: /proc
      fs:     proc
      options: "defaults"
    - device: /sys
      fs:     sysfs
      options: "defaults"
    - device: /dev
      fs:     devtmpfs
      options: "mode=0755,nosuid"
    - device: /dev/pts
      fs:     devpts
      options: "gid=5,mode=620"
    - device: /run
      fs:     tmpfs
      options: "nosuid,nodev,mode=0755"
