---
# Runs post-install.sh inside the installed target chroot after all other exec modules.
# The script is present in the target because unpackfs copied the full live squashfs;
# the linus-branding / calamares-settings-linus packages install it to that path.
script:
    - "/usr/lib/calamares-settings-linus/hooks/post-install.sh"

chroot: true
