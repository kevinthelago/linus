---
# Partitioning module — drives KPMCore.
# Supports UEFI (GPT + ESP) and BIOS (MBR); LUKS optional.

efiSystemPartition:         "/boot/efi"
efiSystemPartitionSize:     "300M"
efiSystemPartitionName:     "EFI System Partition"

userSwapChoices:
    - none
    - small
    - suspend
    - reuse
    - file

defaultFileSystemType:      "ext4"
availableFileSystemTypes:
    - ext4
    - btrfs
    - xfs

allowManualPartitioning:    true
initialPartitioningChoice:  best
initialSwapChoice:          none

# Minimum disk size required in GiB (must match welcome.conf).
requiredStorage:            10.0

drawNestedPartitions:           false
alwaysShowPartitionLabels:      true
