---
# Package operations run in the installed target after unpackfs.
# The install is OFFLINE (no network); only removal of live-specific packages is performed.
# linus-desktop and its dependencies are already present from the squashfs.
backend: apt

operations:
    - remove:
        - live-boot
        - live-boot-initramfs-tools
        - live-config
        - live-config-systemd
        - live-tools
        - user-setup
        - calamares
        - calamares-settings-linus
