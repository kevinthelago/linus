---
# Calamares main configuration for linus.
# Sequence: user-facing pages (show) → install steps (exec) → done page (show).

modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - luksopenswaphookcfg
    - initcfg
    - grubcfg
    - bootloader
    - packages
    - networkcfg
    - hwclock
    - users
    - services-systemd
    - shellprocess@post-install
    - umount
  - show:
    - finished

branding: linus

# Require explicit confirmation before the install begins.
prompt-install:                 false

# Always chroot into the target for exec modules.
dont-chroot:                    false

# OEM first-boot mode is not supported in v1.
oem-setup:                      false

disable-cancel:                 false
disable-cancel-during-exec:     false
hide-back-and-next-during-exec: true

log-level: info
debug-mode: false
