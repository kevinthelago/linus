# /etc/hypr/mantle.conf
# Installed by linus-session. Included from the system Hyprland config to
# autostart mantle and wire up the session environment.

# Propagate vars to systemd/dbus (mirrors the sway drop-in approach)
exec-once = systemctl --user import-environment HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE

# Start mantle via the watchdog for black-screen protection.
# On Hyprland, swaynag is unavailable; the watchdog falls back to a terminal.
exec-once = /usr/lib/linus/mantle-watchdog-hypr.sh
