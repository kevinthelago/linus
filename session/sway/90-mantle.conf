# /etc/sway/config.d/90-mantle.conf
# Installed by linus-session. Autostarts mantle and propagates the session
# environment to systemd/dbus so portal backends, notification daemons, and
# other user services see the correct Wayland socket and desktop variables.

# Propagate key vars to the systemd user instance and dbus-daemon.
# Must run before mantle so portals are discoverable when mantle's webview loads.
exec systemctl --user import-environment \
    DISPLAY WAYLAND_DISPLAY SWAYSOCK \
    XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE

exec dbus-update-activation-environment --systemd \
    DISPLAY WAYLAND_DISPLAY SWAYSOCK \
    XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE

# Start mantle. The watchdog keeps sway alive and shows a recovery notice if
# mantle exits unexpectedly — no black screen.
exec /usr/lib/linus/mantle-watchdog.sh
