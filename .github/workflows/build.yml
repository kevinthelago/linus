name: Build

on:
  push:
    branches:
      - 'feature/**'
      - develop
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential dpkg-dev debhelper lintian \
            reprepro gnupg \
            squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools isolinux \
            live-build debootstrap \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libssl-dev \
            qemu-system-x86 ovmf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'tools/smoke-boot/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # live-build's bootstrap cache; keyed on the snapshot pin and base package list.
      - name: Cache live-build bootstrap
        uses: actions/cache@v4
        with:
          path: .build/bootstrap
          key: ${{ runner.os }}-lb-bootstrap-${{ hashFiles('snapshot.pin', 'contracts/system-packages.md') }}
          restore-keys: ${{ runner.os }}-lb-bootstrap-

      - name: Build smoke-boot harness
        run: cargo build --manifest-path tools/smoke-boot/Cargo.toml --release

      - name: Build packages
        run: make packages

      - name: Build apt repository
        run: make apt-repo

      # live-build requires root for debootstrap and chroot operations.
      - name: Build ISO
        run: sudo make iso

      # Return ownership of any root-owned output files to the runner user.
      - name: Fix dist ownership
        run: sudo chown -R "$(id -u):$(id -g)" dist/ || true

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3
          if-no-files-found: error

      - name: Upload smoke-boot binary
        uses: actions/upload-artifact@v4
        with:
          name: smoke-boot
          path: target/release/smoke-boot
          retention-days: 3
          if-no-files-found: error
