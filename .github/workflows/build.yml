name: Build

on:
  push:
    branches:
      - 'feature/**'
      - develop
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential dpkg-dev debhelper lintian \
            reprepro gnupg \
            squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools isolinux \
            qemu-system-x86 ovmf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/smoke-boot/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tools/smoke-boot/Cargo.lock', 'tools/smoke-boot/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build smoke-boot harness
        run: cargo build --manifest-path tools/smoke-boot/Cargo.toml --release

      - name: Build packages
        run: make packages

      - name: Build apt repository
        run: make apt-repo

      - name: Build ISO
        run: make iso

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3
          if-no-files-found: error

      - name: Upload smoke-boot binary
        uses: actions/upload-artifact@v4
        with:
          name: smoke-boot
          path: tools/smoke-boot/target/release/smoke-boot
          retention-days: 3
          if-no-files-found: error
