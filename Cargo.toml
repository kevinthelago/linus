[workspace]
members = ["tools/smoke-boot"]
# mk/mantle.mk clones mantle into dist/.build/mantle-src. Without excluding dist,
# cargo walks up from mantle's src-tauri, finds THIS workspace, and aborts with
# "current package believes it's in a workspace when it's not" — so the mantle
# .deb can never build.
exclude = ["dist"]
resolver = "2"
