# /etc/systemd/system/greetd.service.d/autologin.conf
# Live-ISO drop-in: replaces greetd's ExecStart to bypass the greeter UI
# and log straight into the linus session as the live user.
#
# The live-build hook installs this file at image assembly time.
# Installed systems do NOT have this drop-in — they use the normal greeter.

[Service]
ExecStart=
ExecStart=/usr/sbin/greetd --config /etc/greetd/autologin.toml
